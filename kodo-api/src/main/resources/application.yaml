spring:
  application:
    name: kodo-api

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 500ms
      timeout: 500ms

  datasource:
    url: jdbc:postgresql://localhost:5434/kodo
    username: kodo
    password: kodo

  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

kodo:
  kafka:
    topic: telemetry.events
  rate-limit:
    enabled: true
    capacity: 10
    refill-rate: 2